# ============================================================================
# 阶段交接契约 标准模板 v1.0
# 协议权威源：../../../01-标准层/04-阶段交接契约Schema.md
# ============================================================================
#
# 用途：每个 QG 通过后必须生成此 YAML，下游阶段读取后方可启动。
# 命名：handoff-{from}-{to}-v{N}.yaml，如 handoff-D-S-v1.0.yaml
# 归档：项目文档/{项目}/_handoffs/
#
# 阶段代号：D=需求 / S=设计 / B=开发 / Ship=交付 / L=复盘
# 质量门禁：QG-D=QG-需求 / QG-S=QG-设计 / QG-B=QG-开发 / QG-Ship=QG-交付
# 逻辑角色：Spec-Writer（需求规范师）/ Builder（构建师）/ Reviewer（审查师）
#           Shipper（交付师）/ Keeper（统筹师）
# HITL 模式：In（每关键阶段审批）/ On（监督不干预）/ Fallback（自动+兜底）
# 不可逆等级：L1（可逆）/ L2（轻损）/ L3（重损）/ L4（不可逆）
#
# 完整填充示例见 examples/ 目录（如 good-D-to-S.yaml）
# 校验：./validate-handoff.sh handoff-{from}-{to}-v1.0.yaml
# ============================================================================

handoff:
  # —— 基础元信息 ——
  schema_version: "1.0"
  project: "{项目名}"                      # 必填
  project_code: "{项目代号}"                # 必填，如 DEMO-2026
  generated_at: "{ISO 8601 时间戳}"         # 必填，如 2026-07-01T10:00:00+08:00
  generated_by: "{生成者：人名 或 AI 工具名}" # 必填

  # —— 阶段流转（默认填最常见的 需求→设计；其它流转见文末速查表）——
  from_stage: "D"                         # 必填：D=需求 / S=设计 / B=开发 / Ship=交付 / L=复盘
  to_stage:   "S"                         # 必填：同上
  quality_gate: "QG-D"                    # 必填：QG-D / QG-S / QG-B / QG-Ship
  gate_status: "passed"                   # 必填：passed / failed / escalated

  # —— 输出产物（工具中立：只描述，不绑工具）——
  output_artifacts:                        # 必填，数组
    - name: "{产物名}"                     # 必填
      path: "{相对路径或 git URL}"          # 必填
      version: "{v1.0|git commit|tag}"     # 必填
      hash: "sha256:..."                   # 可选，关键产物建议加

  # —— Loop 签名链（阶段内微循环记录）——
  loop_signs:                              # 必填，数组
    - stage: "D"                          # 必填：D / S / B / Ship / L（按当前阶段填）
      iterations: 3                        # 必填，Loop 迭代次数（≤5）
      final_eval:                          # 必填，关键 Eval 指标（示例键，按实际阶段替换）
        requirement_completeness: "0.92"   # 如 需求完整度 / 方案完备度 / 单测覆盖率
      reflect_passed: true                 # 必填，主观人审通过
      exit_met: true                       # 必填，是否满足 Exit 条件

  # —— 逻辑角色交接（签字用）——
  handoff:                                 # 必填
    to_role: "{Spec-Writer|Builder|Reviewer|Shipper|Keeper}"
    from_role: "{Spec-Writer|Builder|Reviewer|Shipper|Keeper}"

  # —— 工具记录（中立：记录用了什么，但 schema 不依赖）——
  tool_used:                               # 可选
    primary: "{Claude Code|Codex|Cursor|自带工具|人工}"
    adapter: "{对应 05-适配层/ 的方案名}"
    notes: "{可选说明}"

  # —— HITL 签名 ——
  hitl_signature:                          # 必填
    mode: "In"                             # 必填：In / On / Fallback
    irreversibility: "L3"                  # 必填：L1 可逆 / L2 轻损 / L3 重损 / L4 不可逆
    approved_by:                           # 必填，非空数组
      - role: "{角色}"                     # 如 客户代表 / Spec-Writer / Keeper
        name: "{姓名}"
        timestamp: "{ISO 8601 时间戳}"

  # —— 风险与备注（可选）——
  risk_flags: []                           # 可选，风险描述数组
  notes: "{可选备注文字}"

# ============================================================================
# 各阶段填写要点速查
# ============================================================================
#
# ▶ 需求 → 设计（D → S）
#   - quality_gate: QG-D
#   - 必备产物：需求分析报告 / 干系人清单 / 需求确认书
#   - 关键 Eval：requirement_completeness ≥ 0.9 / scenario_coverage ≥ 0.9
#   - HITL：In + L3（客户签字必备）
#   - from_role: Spec-Writer / to_role: Builder
#
# ▶ 设计 → 开发（S → B）
#   - quality_gate: QG-S
#   - 必备产物：PRD / 原型 Demo / 架构设计 / 详细设计 / 验收标准清单
#   - 关键 Eval：prd_completeness = 1.0 / ac_testable_rate ≥ 0.9
#   - HITL：In + L3（架构评审必备）
#   - from_role: Spec-Writer / to_role: Builder
#
# ▶ 开发 → 交付（B → Ship）
#   - quality_gate: QG-B
#   - 必备产物：源代码 / API 文档 / 联调报告
#   - 关键 Eval：unit_coverage_core ≥ 0.8 / lint_critical = 0 / p0_p1 = 0
#   - HITL：In + L2（关键模块 Plan Mode + Reviewer 审查）
#   - from_role: Builder / to_role: Shipper
#
# ▶ 交付 → 复盘（Ship → L）
#   - quality_gate: QG-Ship
#   - 必备产物：测试报告 / 部署记录 / 验收报告 / 培训材料 / 运维手册
#   - 关键 Eval：case_pass_rate ≥ 0.95 / acceptance_pass_rate = 1.0
#   - HITL：In + L4（生产部署 + 客户签字，不可逆）
#   - from_role: Shipper / to_role: Keeper
# ============================================================================
